[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoseed"
version = "0.1.0"
description = "A bounded evolutionary engine for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
evoseed = "evoseed.cli:main"

[tool.setuptools.packages.find]
include = ["evoseed*"]
